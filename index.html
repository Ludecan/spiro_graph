<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Interactive neon spirograph playground — real hypotrochoid and epitrochoid math, kaleidoscope, glow, trails and export.">
<meta name="theme-color" content="#04060f">
<title>SPIRO✦GRAPH — neon pattern playground</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='30' fill='none' stroke='%237c6cff' stroke-width='7'/><circle cx='50' cy='50' r='13' fill='none' stroke='%2322d3ee' stroke-width='5'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #7c6cff;
    --accent2: #22d3ee;
    --panel-bg: rgba(12, 14, 30, 0.55);
    --text: #e6e9ff;
    --muted: #8a90b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    background: #04060f;
    color: var(--text);
    display: flex;
  }
  /* canvas stage — takes all space right of the docked panel */
  #stage { position: relative; flex: 1 1 auto; min-width: 0; height: 100dvh; overflow: hidden; }
  /* NOTE: canvas is a replaced element — inset alone won't stretch it;
     explicit 100% size prevents it rendering at intrinsic (dpr-scaled) size */
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #main { z-index: 0; }
  /* glow layer: halo, screen-blended over the ink canvas so it fades independently */
  #glow { z-index: 1; pointer-events: none; mix-blend-mode: screen; }
  /* dot layer: just the live pen tip, re-cleared every frame */
  #dot { z-index: 2; pointer-events: none; mix-blend-mode: screen; }

  /* decorative blobs floating over the art */
  .blob {
    position: absolute; z-index: 3; pointer-events: none;
    border-radius: 50%; filter: blur(90px); mix-blend-mode: screen; opacity: .16;
    animation: drift 14s ease-in-out infinite alternate;
  }
  .blob.a { width: 42vw; height: 42vw; background: #6d28d9; top: -12vw; right: -10vw; }
  .blob.b { width: 34vw; height: 34vw; background: #0891b2; bottom: -14vw; left: 8vw; animation-delay: -7s; }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(4vw, 3vh) scale(1.15); }
  }

  /* ---------- control panel (docked left) ---------- */
  #panel {
    flex: 0 0 320px; width: 320px; height: 100dvh;
    display: flex; flex-direction: column; gap: 9px;
    padding: 16px 18px 10px;
    background: rgba(10, 12, 26, 0.82);
    border: none; border-right: 1px solid rgba(255, 255, 255, 0.10);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 14px 0 48px rgba(0, 0, 0, 0.45);
    overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.18) transparent;
    transition: margin-left 0.35s cubic-bezier(.6,.2,.2,1);
    z-index: 10;
  }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); border-radius: 3px; }
  body.panel-hidden #panel { margin-left: -320px; }
  /* narrow screens: panel floats over the stage instead of squeezing it */
  @media (max-width: 719px) {
    #panel {
      position: fixed; left: 12px; top: 12px; bottom: 12px;
      width: min(304px, calc(100vw - 24px)); height: auto;
      border: 1px solid rgba(255, 255, 255, 0.10); border-radius: 18px;
      /* the overlay sits above a continuously animating canvas; keep the
         backdrop blur modest so mobile GPUs are not re-blurring every frame */
      background: rgba(10, 12, 26, 0.92);
      backdrop-filter: blur(10px) saturate(130%);
      -webkit-backdrop-filter: blur(10px) saturate(130%);
      transition: transform 0.35s cubic-bezier(.6,.2,.2,1), opacity 0.3s;
    }
    body.panel-hidden #panel { margin-left: 0; transform: translateX(-130%); opacity: 0; pointer-events: none; }
  }
  #panel header { display: flex; align-items: center; justify-content: space-between; }
  #panel h1 {
    font-size: 17px; font-weight: 700; letter-spacing: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent));
    background-size: 200%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 5s linear infinite;
  }
  @keyframes shimmer { to { background-position: 200%; } }
  #panel h1 i { font-style: normal; }
  .icon-btn {
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    color: var(--muted); width: 28px; height: 28px; border-radius: 9px;
    cursor: pointer; font-size: 13px; line-height: 1; transition: .2s;
  }
  .icon-btn:hover { color: var(--text); background: rgba(255,255,255,.12); }

  .field { display: flex; flex-direction: column; gap: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .field .lbl {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11px; letter-spacing: 0.6px; text-transform: uppercase; color: var(--muted);
  }
  .field .lbl b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  /* per-control locks: hidden until hover, always visible when locked */
  .lbl .rv { display: flex; align-items: center; gap: 3px; }
  .lock {
    border: none; background: transparent; padding: 0 1px; cursor: pointer;
    font-size: 10px; line-height: 1; opacity: 0; transition: opacity .15s, transform .15s;
  }
  .field:hover .lock, .moderow:hover .lock, .switch:hover .lock, .lock:focus-visible { opacity: .45; }
  .lock:hover { opacity: 1 !important; transform: scale(1.25); }
  .lock.on { opacity: .95; }
  .lock.right { margin-left: auto; }
  .moderow { display: flex; align-items: center; gap: 7px; }
  .moderow .seg { flex: 1; }
  #msField, #tdField, #gdField { opacity: .35; transition: opacity .25s; }
  #msField.live, #tdField.live, #gdField.live { opacity: 1; }
  #msField:not(.live), #tdField:not(.live), #gdField:not(.live) { display: none; }

  input[type="range"] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 16px;
    background: transparent; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 4px; border-radius: 4px;
    background: linear-gradient(90deg, var(--accent) var(--p, 50%), rgba(255,255,255,.13) var(--p, 50%));
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    margin-top: -5px; background: #fff; border: none;
    box-shadow: 0 0 10px var(--accent), 0 0 22px rgba(124,108,255,.55);
    transition: transform .15s;
  }
  input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.25); }
  input[type="range"]::-moz-range-track { height: 4px; border-radius: 4px; background: rgba(255,255,255,.13); }
  input[type="range"]::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--accent); }
  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%; background: #fff; border: none;
    box-shadow: 0 0 10px var(--accent);
  }

  /* segmented mode toggle */
  .seg { display: flex; background: rgba(255,255,255,.06); border-radius: 11px; padding: 3px; gap: 3px; }
  .seg button {
    flex: 1; padding: 6px 0; font: inherit; font-size: 12px; color: var(--muted);
    background: transparent; border: none; border-radius: 9px; cursor: pointer; transition: .2s;
  }
  .seg button.on {
    color: #fff;
    background: linear-gradient(135deg, rgba(124,108,255,.85), rgba(34,211,238,.65));
    box-shadow: 0 2px 14px rgba(124,108,255,.45);
  }

  /* switch */
  .switch { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--muted); cursor: pointer; user-select: none; position: relative; }
  /* visually hidden, but still keyboard-focusable (display:none would remove it from tab order) */
  .switch input[type="checkbox"] {
    position: absolute; width: 1px; height: 1px; margin: 0; opacity: 0; pointer-events: none;
  }
  .switch input:focus-visible + i {
    outline: 2px solid var(--accent); outline-offset: 2px;
    box-shadow: 0 0 0 2px rgba(124,108,255,.22);
  }
  .switch .pickwrap { margin-left: auto; display: flex; gap: 6px; }
  input[type="color"] {
    width: 27px; height: 20px; padding: 0; background: transparent; cursor: pointer;
    border: 1px solid rgba(255,255,255,.25); border-radius: 6px;
  }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
  input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }
  input[type="color"]::-moz-color-swatch { border: none; border-radius: 4px; }
  .switches { display: flex; flex-direction: column; gap: 9px; }
  .switch i {
    width: 34px; height: 19px; border-radius: 20px; background: rgba(255,255,255,.13);
    position: relative; transition: .25s; flex: none;
  }
  .switch i::after {
    content: ''; position: absolute; top: 2.5px; left: 3px; width: 14px; height: 14px;
    border-radius: 50%; background: #fff; transition: .25s;
  }
  .switch input:checked + i { background: linear-gradient(90deg, var(--accent), var(--accent2)); box-shadow: 0 0 12px rgba(124,108,255,.5); }
  .switch input:checked + i::after { transform: translateX(14px); }

  /* buttons */
  .btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .btns button {
    font: inherit; font-size: 12px; padding: 8px 0; color: var(--text);
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.13);
    border-radius: 11px; cursor: pointer; transition: .18s;
  }
  .btns button:hover { background: rgba(255,255,255,.14); transform: translateY(-1px); }
  .btns button.primary {
    grid-column: 1 / -1;
    background: linear-gradient(135deg, rgba(124,108,255,.9), rgba(34,211,238,.7));
    border: none; font-weight: 600; letter-spacing: .5px;
    box-shadow: 0 4px 18px rgba(124,108,255,.35);
  }
  .btns button.span2 { grid-column: span 2; }
  #rec.live {
    color: #ffb9b9; border-color: rgba(255, 90, 90, .55);
    animation: recpulse 1.1s ease-in-out infinite;
  }
  @keyframes recpulse { 50% { box-shadow: 0 0 18px rgba(255, 60, 60, .6); } }
  select {
    font: inherit; font-size: 12.5px; color: var(--text);
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.13);
    border-radius: 11px; padding: 8px 10px; cursor: pointer; width: 100%;
  }
  select option { background: #10132b; }
  #panel footer { font-size: 10.5px; color: var(--muted); text-align: center; letter-spacing: .4px; }
  #panel footer kbd {
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14);
    border-radius: 5px; padding: 1px 4px; font-family: inherit; font-size: 9.5px;
  }
  hr { border: none; border-top: 1px solid rgba(255,255,255,.08); }

  /* progress stat */
  .stat { display: flex; align-items: center; gap: 9px; font-size: 10.5px; color: var(--muted); }
  .stat .bar { flex: 1; height: 4px; border-radius: 4px; background: rgba(255,255,255,.10); overflow: hidden; }
  .stat .bar i { display: block; height: 100%; width: 0%; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .stat span { font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* floating reopen button */
  #reveal {
    position: fixed; z-index: 9; left: 16px; top: 16px;
    width: 44px; height: 44px; border-radius: 14px; font-size: 18px;
    background: var(--panel-bg); border: 1px solid rgba(255,255,255,.14); color: var(--text);
    backdrop-filter: blur(14px); cursor: pointer;
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  #reveal.show { opacity: 1; pointer-events: auto; }

  /* done badge */
  #badge {
    position: absolute; z-index: 5; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(8px);
    padding: 8px 18px; border-radius: 99px; font-size: 13px; letter-spacing: .5px;
    background: var(--panel-bg); border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(12px); opacity: 0; transition: .4s; pointer-events: none;
    max-width: calc(100vw - 40px); text-align: center;
  }
  #badge.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* respect reduced-motion preferences: the artwork still animates, but the
     decorative chrome stops shimmering/drifting */
  @media (prefers-reduced-motion: reduce) {
    #panel h1, .blob, #rec.live { animation: none; }
    #panel, #reveal, .lock, .btns button, #badge { transition: none; }
  }
</style>
</head>
<body>

<aside id="panel">
  <header>
    <h1>SPIRO<i>✦</i>GRAPH</h1>
    <button class="icon-btn" id="collapse" title="Hide panel (H)">✕</button>
  </header>

  <div class="moderow">
    <div class="seg" id="mode" title="Which side of the circle rolls along the ring — toggling restarts the drawing">
      <button data-mode="hypo" class="on" title="Circle rolls inside the ring — classic spirograph loops">Hypotrochoid</button>
      <button data-mode="epi" title="Circle rolls outside the ring — flowing star & flower curves">Epitrochoid</button>
    </div>
    <button class="lock" data-lock="mode" title="Lock — kept through Random">🔓</button>
  </div>

  <div class="field" title="Radius of the fixed ring the circle rolls around — the overall size of the figure">
    <span class="lbl">Ring radius <span class="rv"><b id="vR"></b><button class="lock" data-lock="R" title="Lock — kept through Random">🔓</button></span></span>
    <input type="range" id="R" min="40" max="400" step="1"></div>
  <div class="field" title="Radius of the rolling circle. The ratio R∶r sets the lobe count — copride values close after many laps, simple ratios close early">
    <span class="lbl">Planet radius <span class="rv"><b id="vr"></b><button class="lock" data-lock="r" title="Lock — kept through Random">🔓</button></span></span>
    <input type="range" id="r" min="4" max="300" step="1"></div>
  <div class="field" title="How far the pen sits from the rolling circle's centre — bigger reaches farther out and fattens the lobes">
    <span class="lbl">Pen offset <span class="rv"><b id="vd"></b><button class="lock" data-lock="d" title="Lock — kept through Random">🔓</button></span></span>
    <input type="range" id="d" min="0" max="320" step="1"></div>
  <div class="grid2">
    <div class="field" title="Rock the pen distance in and out as it draws — makes the line shimmer and breathe">
      <span class="lbl">Pen wobble <span class="rv"><b id="vwob"></b><button class="lock" data-lock="wob" title="Lock — kept through Random">🔓</button></span></span>
      <input type="range" id="wob" min="0" max="160" step="5"></div>
    <div class="field" title="How many times the wobble cycles per lap of the planet">
      <span class="lbl">Wobble freq <span class="rv"><b id="vwf"></b><button class="lock" data-lock="wf" title="Lock — kept through Random">🔓</button></span></span>
      <input type="range" id="wf" min="1" max="12" step="1"></div>
  </div>
  <div class="grid2">
    <div class="field" title="Kaleidoscope: draw N rotated copies of the curve around the centre (every other slice is mirrored)">
      <span class="lbl">Mirror ×<span class="rv"><b id="vmir"></b><button class="lock" data-lock="mirror" title="Lock — kept through Random">🔓</button></span></span>
      <input type="range" id="mirror" min="1" max="12" step="1"></div>
    <div class="field" title="Twist the pen arm as it draws — swirl the whole figure into spirals (negative = counter-swirl)">
      <span class="lbl">Spin <span class="rv"><b id="vspn"></b><button class="lock" data-lock="spin" title="Lock — kept through Random">🔓</button></span></span>
      <input type="range" id="spin" min="-1.5" max="1.5" step="0.1"></div>
  </div>

  <hr>

  <div class="grid2">
    <div class="field" title="How fast the pen travels along the curve">
      <span class="lbl">Speed <span class="rv"><b id="vsp"></b><button class="lock" data-lock="sp" title="Lock — kept through Random">🔓</button></span></span>
      <input type="range" id="sp" min="0.2" max="8" step="0.1"></div>
    <div class="field" title="Thickness of the bright core stroke (the halo scales with it)">
      <span class="lbl">Line width <span class="rv"><b id="vw"></b><button class="lock" data-lock="w" title="Lock — kept through Random">🔓</button></span></span>
      <input type="range" id="w" min="0.5" max="6" step="0.1"></div>
  </div>
  <div class="grid2">
    <div class="field" title="How fast the rainbow cycles as the pen draws — 0 keeps a single colour">
      <span class="lbl">Color shift <span class="rv"><b id="vhs"></b><button class="lock" data-lock="hs" title="Lock — kept through Random">🔓</button></span></span>
      <input type="range" id="hs" min="0" max="10" step="0.1"></div>
    <div class="field" title="Strength of the neon halo around each stroke — 0 draws bare lines">
      <span class="lbl">Glow <span class="rv"><b id="vg"></b><button class="lock" data-lock="g" title="Lock — kept through Random">🔓</button></span></span>
      <input type="range" id="g" min="0" max="10" step="0.5"></div>
  </div>

  <hr>

  <div class="switches">
    <label class="switch" title="Comet mode: the whole drawing slowly dissolves and the curve loops forever — never 'finishes'">
      <input type="checkbox" id="fade"><i></i>Fade trails (endless loop)
      <button class="lock right" data-lock="fade" title="Lock — kept through Random">🔓</button>
    </label>
    <div class="field" id="tdField" title="Seconds a drawn trail segment stays before it has fully dissolved">
      <span class="lbl">Trail duration <span class="rv"><b id="vtd"></b><button class="lock" data-lock="td" title="Lock — kept through Random">🔓</button></span></span>
      <input type="range" id="td" min="0.3" max="60" step="0.1"></div>
    <label class="switch" title="The neon aura evaporates while the colored trail stays permanently inked">
      <input type="checkbox" id="fglow"><i></i>Fade glow (trail stays inked)
      <button class="lock right" data-lock="fglow" title="Lock — kept through Random">🔓</button>
    </label>
    <div class="field" id="gdField" title="Seconds a glow halo lingers before it has fully evaporated">
      <span class="lbl">Glow duration <span class="rv"><b id="vgd"></b><button class="lock" data-lock="gd" title="Lock — kept through Random">🔓</button></span></span>
      <input type="range" id="gd" min="0.3" max="60" step="0.1"></div>
    <label class="switch" title="Parameter changes never wipe the canvas — the pen jumps to the new curve and keeps layering art on top">
      <input type="checkbox" id="keep"><i></i>Free draw (never resets)
      <button class="lock right" data-lock="keep" title="Lock — kept through Random">🔓</button>
    </label>
    <label class="switch" title="Ring, planet and pen drift on their own — an ever-shaping lava lamp">
      <input type="checkbox" id="morph"><i></i>Auto-morph (drifting shapes)
      <button class="lock right" data-lock="morph" title="Lock — kept through Random">🔓</button>
    </label>
    <div class="field" id="msField" title="How quickly the auto-morph drift reshapes the figure">
      <span class="lbl">Morph speed <span class="rv"><b id="vms"></b><button class="lock" data-lock="ms" title="Lock — kept through Random">🔓</button></span></span>
      <input type="range" id="ms" min="0.2" max="4" step="0.1"></div>
    <label class="switch" title="A second pen on the opposite side of the rolling circle draws with you">
      <input type="checkbox" id="twin"><i></i>Twin pen (opposite side)
      <button class="lock right" data-lock="twin" title="Lock — kept through Random">🔓</button>
    </label>
    <label class="switch" title="Mix two chosen colours along the stroke instead of the rainbow">
      <input type="checkbox" id="c2"><i></i>Two colors
      <span class="pickwrap">
        <input type="color" id="ca" value="#7c6cff" title="Pen colour A"><input type="color" id="cb" value="#22d3ee" title="Pen colour B">
        <button class="lock" data-lock="c2" title="Lock — kept through Random">🔓</button>
      </span>
    </label>
  </div>

  <hr>

  <div class="btns">
    <button class="primary" id="play" title="Pause or resume the pen (Space)">⏸ Pause</button>
    <button id="clear" title="Wipe the canvas and redraw from scratch (C)">↺ Restart</button>
    <button id="rand" title="Roll new parameters — locked controls stay untouched (R)">🎲 Random</button>
    <button id="ff" title="Instantly draw the curve to its closing point">⏩ Finish</button>
    <button id="save" title="Download the canvas stack as a PNG image">💾 PNG</button>
    <button id="rec" title="Record a WebM video of the drawing in motion">⏺ Rec</button>
    <button id="link" title="Copy a URL that captures this exact look (L)">🔗 Link</button>
  </div>

  <select id="presets" title="Jump to a hand-tuned starting point">
    <option value="">✦ Load a preset…</option>
  </select>

  <div class="stat"><div class="bar"><i id="bar"></i></div><span id="stat" title="How far along the curve we are, and after how many laps it closes"></span></div>

  <footer><kbd>Space</kbd> play · <kbd>R</kbd> random · <kbd>M</kbd> morph · <kbd>C</kbd> clear · <kbd>L</kbd> link · <kbd>H</kbd> hide</footer>
</aside>

<main id="stage">
  <canvas id="main"></canvas>
  <canvas id="glow"></canvas>
  <canvas id="dot"></canvas>
  <div class="blob a"></div>
  <div class="blob b"></div>
  <div id="badge" role="status" aria-live="polite"></div>
</main>

<button id="reveal" title="Show controls (H)">✦</button>

<script>
'use strict';

/* ============================== state ============================== */
const S = {
  mode: 'hypo',
  R: 220,        // fixed ring radius (abstract units)
  r: 77,         // rolling planet radius
  d: 130,        // pen offset from planet center
  wob: 0,        // pen wobble amplitude (adds oscillation to pen distance)
  wf: 4,         // wobble frequency (cycles per radian of t)
  speed: 2,      // radians / second
  width: 1.6,    // core stroke width
  hueSpeed: 2.4, // rainbow rate (0 = fixed color)
  glow: 4,       // neon halo strength
  mirror: 1,     // kaleidoscope: rotational copies drawn (1 = off)
  spin: 0,       // global swirl: radians of rotation per radian drawn
  twin: false,   // twin pen on the opposite side of the planet
  c2: false,     // two-color mode (mix A/B instead of rainbow hue)
  colA: '#7c6cff',
  colB: '#22d3ee',
  trailDur: 8,   // seconds an ink segment stays visible before it's gone
  glowDur: 2.5,  // seconds a halo lingers before it's gone
  fade: false,   // fading trails (ink comet)
  fadeGlow: false, // halo + pen dot dissolve, colored trail stays
  keep: false,   // free draw: parameter changes never clear the canvas
  morph: false,  // auto-morph: parameters drift over time
  morphSpeed: 1, // drift rate
  playing: true,
};
let hue0 = 290; // base hue (randomizable)

const PRESETS = [
  { name: 'Nebula Bloom',   mode:'hypo', R:240, r:71,  d:148, wob:0,   wf:4, hue:0,   hs:2.2, g:4.5, w:1.6 },
  { name: 'Ion Ring',       mode:'epi',  R:180, r:24,  d:150, wob:0,   wf:4, hue:185, hs:3.6, g:5,   w:1.4 },
  { name: 'Star Anvil',     mode:'epi',  R:260, r:117, d:210, wob:0,   wf:4, hue:45,  hs:1.6, g:4,   w:1.8 },
  { name: 'Atom Shell',     mode:'epi',  R:320, r:15,  d:260, wob:0,   wf:4, hue:200, hs:5,   g:6,   w:1.1 },
  { name: 'Galaxy Spiral',  mode:'hypo', R:360, r:173, d:96,  wob:0,   wf:4, hue:280, hs:1.2, g:3.5, w:1.7 },
  { name: 'Tiny Gears',     mode:'hypo', R:300, r:47,  d:40,  wob:0,   wf:4, hue:40,  hs:3,   g:3,   w:1.2 },
  { name: 'Jelly Bloom',    mode:'hypo', R:260, r:83,  d:120, wob:75,  wf:5, hue:320, hs:3,   g:5,   w:1.5 },
  { name: 'Wobble Worm',    mode:'epi',  R:150, r:95,  d:170, wob:110, wf:3, hue:110, hs:4,   g:4.5, w:1.3 },
  { name: 'Mirror Mandala', mode:'hypo', R:220, r:77,  d:130, wob:0,   wf:4, hue:210, hs:2,   g:4,   w:1.4, mir:6, sn:0.12 },
  { name: 'Twin Nebula',    mode:'hypo', R:260, r:97,  d:150, wob:0,   wf:4, hue:265, hs:2.8, g:5,   w:1.5, tw:true },
];

/* ============================ canvas setup ============================ */
const cv = document.getElementById('main'), ctx = cv.getContext('2d');   // ink layer
const gcv = document.getElementById('glow'), gctx = gcv.getContext('2d'); // glow layer
const dcv = document.getElementById('dot'), dctx = dcv.getContext('2d'); // live pen tip layer
const stage = document.getElementById('stage');
let W = 0, H = 0, cx = 0, cy = 0, sc = 1; // css-pixel viewport + transform

// drawing runtime
let tCur = 0;        // current angle along curve (radians, wrapped at tMax)
let tAbs = 0;        // unwrapped time — keeps wobble phase continuous across wraps
let hue = hue0;      // current stroke hue
let done = false;    // curve closed (strict / non-free mode)
let lastFrame = performance.now();
let lastPt = null;         // last stroke endpoint (canvas px)
let pendingConnect = false;// draw a connector from lastPt on the next stroke (free-draw param change)
let paramSeq = 0;          // bumped whenever geometry changes (free-draw close detection)
let lastWrapSeq = -1;
let statTick = 0;          // throttles the panel progress line

const TAU = Math.PI * 2;
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

// laps until the (static) curve closes; rounded so morphing floats can't wedge the gcd
function tMax() {
  const R = Math.max(1, Math.round(S.R)), r = Math.max(1, Math.round(S.r));
  return TAU * (r / gcd(R, r));
}

// always recompute the transform — guarantees the art can never outgrow the canvas
function computeFit() {
  const k = (S.mode === 'epi' ? S.R + S.r : S.R - S.r);
  const extent = Math.max(1, Math.abs(k) + S.d + S.wob); // max pen reach
  const margin = (S.width + S.glow * 2.0) * 0.5 + 3;     // keep the neon halo inside too
  sc = Math.max(0.0005, (Math.min(W, H) * 0.445 - margin) / extent);
  cx = W / 2; cy = H / 2;
}

// curve point at angle t; ta = unwrapped time driving wobble phase + spin swirl
function pt(t, ta) {
  const k = (S.mode === 'epi' ? S.R + S.r : S.R - S.r);
  const q = k / S.r;
  const rho = S.d + S.wob * Math.sin(S.wf * ta);
  const c = Math.cos(t), s = Math.sin(t);
  const qc = Math.cos(q * t), qs = Math.sin(q * t);
  let x = S.mode === 'epi' ? k * c - rho * qc : k * c + rho * qc;
  let y = k * s - rho * qs;
  if (S.spin) { // drawing on a spinning turntable
    const a = S.spin * ta, ca = Math.cos(a), sa = Math.sin(a);
    const xr = x * ca - y * sa;
    y = x * sa + y * ca; x = xr;
  }
  return [cx + x * sc, cy + y * sc];
}

// main + twin pen (opposite side of the planet) in one pass: shares all trig work
function ptBoth(t, ta) {
  const k = (S.mode === 'epi' ? S.R + S.r : S.R - S.r);
  const q = k / S.r;
  const rho = S.d + S.wob * Math.sin(S.wf * ta);
  const c = Math.cos(t), s = Math.sin(t);
  const qc = Math.cos(q * t), qs = Math.sin(q * t);
  let x1 = S.mode === 'epi' ? k * c - rho * qc : k * c + rho * qc;
  let y1 = k * s - rho * qs;
  let x2 = S.mode === 'epi' ? k * c + rho * qc : k * c - rho * qc;
  let y2 = k * s + rho * qs;
  if (S.spin) {
    const a = S.spin * ta, ca = Math.cos(a), sa = Math.sin(a);
    const xr1 = x1 * ca - y1 * sa;
    y1 = x1 * sa + y1 * ca; x1 = xr1;
    const xr2 = x2 * ca - y2 * sa;
    y2 = x2 * sa + y2 * ca; x2 = xr2;
  }
  return [[cx + x1 * sc, cy + y1 * sc], [cx + x2 * sc, cy + y2 * sc]];
}

/* color helpers: rainbow hue or two-color A↔B mix */
const rgbCache = new Map();
const hex2rgb = (hx) => {
  let v = rgbCache.get(hx);
  if (!v) {
    v = [parseInt(hx.slice(1, 3), 16), parseInt(hx.slice(3, 5), 16), parseInt(hx.slice(5, 7), 16)];
    if (rgbCache.size > 32) rgbCache.clear(); // bounded: random palettes change often
    rgbCache.set(hx, v);
  }
  return v;
};
function hslHex(h) { // saturated-ish color at hue h, for random palettes
  const s = 0.8, l = 0.62, a = s * Math.min(l, 1 - l);
  const f = (n) => {
    const k = (n + h / 30) % 12;
    const c = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
    return Math.round(255 * c).toString(16).padStart(2, '0');
  };
  return `#${f(0)}${f(8)}${f(4)}`;
}
function mixRGB(a, b, m) {
  const A = hex2rgb(a), B = hex2rgb(b);
  return [Math.round(A[0] + (B[0] - A[0]) * m), Math.round(A[1] + (B[1] - A[1]) * m), Math.round(A[2] + (B[2] - A[2]) * m)];
}
function colorSpec(ph, twin) {
  const ga = 0.04 + S.glow * 0.015;
  if (S.c2) {
    let m = 0.5 + 0.5 * Math.sin(ph);
    if (twin) m = 1 - m; // twin wears the swapped color
    const [r, g, b] = mixRGB(S.colA, S.colB, m);
    const wr = Math.round(r + (255 - r) * 0.45), wg = Math.round(g + (255 - g) * 0.45), wb = Math.round(b + (255 - b) * 0.45);
    return { core: `rgba(${wr},${wg},${wb},0.92)`, glow: `rgba(${r},${g},${b},${ga})` };
  }
  const h = ph + (twin ? 45 : 0);
  return { core: `hsla(${h},100%,74%,0.92)`, glow: `hsla(${h},95%,58%,${ga})` };
}

// The radial background is created once per viewport size; fade mode repaints
// the background every frame, so rebuilding the gradient each frame is wasted work.
let bgGrad = null, bgKey = '';
function paintBg() {
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#04060f';
  ctx.fillRect(0, 0, W, H);
  const key = `${W}x${H}@${cx},${cy}`;
  if (!bgGrad || bgKey !== key) {
    bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.75);
    bgGrad.addColorStop(0, 'rgba(64,84,190,0.16)');
    bgGrad.addColorStop(1, 'rgba(0,0,0,0)');
    bgKey = key;
  }
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
}

// per-frame fade alpha that makes content invisible (down to 1/255 ≈ eyes-off)
// exactly `dur` seconds after it was drawn, no matter the frame rate:
// remaining brightness after T s = exp(-ln(255)·T/dur)  →  1/255 at T = dur
const LN255 = Math.log(255);
function decayAlpha(dt, dur) {
  return 1 - Math.exp(-LN255 * dt / Math.max(0.05, dur));
}

function fadeFrame(dt) {
  ctx.globalAlpha = decayAlpha(dt, S.trailDur); // trail duration knob
  paintBg();
  ctx.globalAlpha = 1;
}

// dissolve the glow layer by shaving its alpha each frame (ink canvas untouched)
function glowFade(dt) {
  gctx.globalCompositeOperation = 'destination-out';
  gctx.fillStyle = `rgba(0,0,0,${decayAlpha(dt, S.glowDur)})`;
  gctx.fillRect(0, 0, W, H);
  gctx.globalCompositeOperation = 'lighter';
}

/* ============================ stroke drawing ============================ */
// Build the polyline once per color chunk, then reuse it for every
// kaleidoscope slice and for both the glow and ink layers.
function buildPath(P) {
  const path = new Path2D();
  path.moveTo(P[0][0], P[0][1]);
  for (let i = 1; i < P.length; i++) path.lineTo(P[i][0], P[i][1]);
  return path;
}

// draw one slice; rotation/reflection happen via the canvas transform, so no
// point arrays are cloned for kaleidoscope copies
function strokeSlice(c, path, style, lineWidth, angle, flip) {
  c.save();
  if (angle || flip) {
    c.translate(cx, cy);
    c.rotate(angle);
    if (flip) c.scale(1, -1);
    c.translate(-cx, -cy);
  }
  c.strokeStyle = style;
  c.lineWidth = lineWidth;
  c.stroke(path);
  c.restore();
}

function strokeLine(path, sp, angle = 0, flip = false) {
  if (S.glow > 0) { // halo lives on the glow layer
    strokeSlice(gctx, path, sp.glow, S.width + S.glow * 2.0, angle, flip);
  }
  strokeSlice(ctx, path, sp.core, S.width, angle, flip); // colored core is permanent ink
}

function strokeChunk(pts, pts2, ph) {
  lastPt = pts[pts.length - 1];
  const N = Math.min(12, Math.max(1, Math.round(S.mirror)));
  const spA = colorSpec(ph, false);
  const spB = pts2 && pts2.length ? colorSpec(ph, true) : null;
  const pathA = pts.length > 1 ? buildPath(pts) : null;
  const pathB = spB && pts2.length > 1 ? buildPath(pts2) : null;
  for (let k = 0; k < N; k++) {
    const angle = N > 1 ? k * TAU / N : 0;
    const flip = N > 1 && (k & 1) === 1; // odd kaleidoscope slices are mirrored
    if (pathA) strokeLine(pathA, spA, angle, flip);
    if (pathB) strokeLine(pathB, spB, angle, flip);
  }
}

// draw the curve from angle t0 -> t1, advancing hue, wobble phase and spin along the way
function strokeSeg(t0, t1) {
  if (t1 <= t0) return;
  computeFit(); // fresh transform every stroke: shape always fits the viewport
  const cont = pendingConnect && lastPt; // free-draw: pen drags a line to the new curve
  pendingConnect = false;
  const k = (S.mode === 'epi' ? S.R + S.r : S.R - S.r);
  const q = Math.max(1, Math.abs(k / S.r));
  const maxStep = Math.min(0.02, 0.05 / q); // keep pen-arm rotation per step small
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = ctx.lineJoin = 'round';
  gctx.globalCompositeOperation = 'lighter';
  gctx.lineCap = gctx.lineJoin = 'round';

  const twin = S.twin, c2 = S.c2;
  const breakTh = c2 ? 0.28 : 3; // color-chunk granularity per mode
  const phase = () => (c2 ? S.hueSpeed * tAbs * 0.6 : hue);

  let pts, pts2 = null;
  if (twin) {
    const [pA, pB] = ptBoth(t0, tAbs);
    pts = [cont ? [lastPt[0], lastPt[1]] : pA];
    pts2 = [pB];
  } else {
    pts = [cont ? [lastPt[0], lastPt[1]] : pt(t0, tAbs)];
  }
  let t = t0, phAnchor = phase();
  while (t < t1) {
    const nt = Math.min(t1, t + maxStep);
    hue += S.hueSpeed * (nt - t) * 8;
    tAbs += nt - t;
    t = nt;
    if (twin) {
      const [pA, pB] = ptBoth(t, tAbs);
      pts.push(pA); pts2.push(pB);
    } else {
      pts.push(pt(t, tAbs));
    }
    const ph = phase();
    if (Math.abs(ph - phAnchor) >= breakTh && t < t1) {
      strokeChunk(pts, pts2, (phAnchor + ph) / 2);
      pts = [pts[pts.length - 1]];
      if (twin) pts2 = [pts2[pts2.length - 1]];
      phAnchor = ph;
    }
  }
  strokeChunk(pts, pts2, phase());
}

// instant redraw of everything from 0 -> tEnd (after resize)
function redrawTo(tEnd) {
  if (tEnd <= 0) return;
  computeFit();
  tAbs = 0;
  hue = hue0;
  lastPt = null;
  gctx.clearRect(0, 0, W, H);
  strokeSeg(0, tEnd);
}

function restart(t0 = 0) {
  computeFit();
  paintBg();
  gctx.clearRect(0, 0, W, H);
  tCur = t0;
  tAbs = t0;
  hue = hue0 + S.hueSpeed * 8 * t0;
  done = false;
  lastPt = null;
  pendingConnect = false;
  lastWrapSeq = paramSeq;
  badge.classList.remove('show');
}

function showBadge(text) {
  badge.textContent = text;
  badge.classList.add('show');
}

function unDone() {
  if (done) { done = false; badge.classList.remove('show'); }
}

/* --------------------- progress stat & fast-forward --------------------- */
function statText() {
  const T = tMax(), laps = T / TAU, lapNow = tCur / TAU;
  if (S.morph) return '∞ morphing — canvas grows';
  if (S.fade) return `∞ looping · lap ${(lapNow % 1).toFixed(2)} · ${Math.floor(lapNow) + 1} loops`;
  if (done) return `✦ closed after ${laps} laps`;
  const rem = Math.max(0, (T - tCur) / TAU);
  const remTxt = rem < 0.05 ? 'moments' : `~${rem >= 10 ? Math.round(rem) : rem.toFixed(1)} laps`;
  return `lap ${lapNow.toFixed(1)} / ${laps} · closes in ${remTxt}`;
}

function updateStat() {
  $('stat').textContent = statText();
  const T = tMax();
  const frac = (S.fade || S.keep || S.morph) ? (tCur % T) / T : Math.min(1, tCur / T);
  $('bar').style.width = (frac * 100).toFixed(1) + '%';
}

// instantly trace the rest of the curve (a big redrawTo)
function fastForward() {
  if (done) return;
  const T = tMax();
  if (tCur < T) strokeSeg(tCur, T);
  if (S.fade || S.morph) {
    tCur = 0;
    lastWrapSeq = paramSeq; // endless modes just completed one loop
  } else {
    tCur = T;
    done = true;
    lastWrapSeq = paramSeq;
    showBadge(S.keep
      ? '✦ Curve closed — tweak any slider to keep drawing'
      : '✦ Curve complete — tweak a slider, hit Random or load a preset');
  }
  updateStat();
}

/* ============================== auto-morph ============================== */
let morphTick = 0;
let morphNoiseR = 0, morphNoiseD = 0; // low-passed wander: smooth drift instead of frame jitter
function morphStep(now, dt) {
  const m = S.morphSpeed;
  morphNoiseR = morphNoiseR * 0.92 + (Math.random() - 0.5) * 0.16;
  morphNoiseD = morphNoiseD * 0.92 + (Math.random() - 0.5) * 0.16;
  if (!isLocked('R')) S.R = clamp(S.R + Math.sin(now / 5100) * m * dt * 6, 40, 400);
  if (!isLocked('r')) S.r = clamp(S.r + (Math.sin(now / 3200) * 0.6 + morphNoiseR) * m * dt * 16, 4, 300);
  if (!isLocked('d')) S.d = clamp(S.d + (Math.cos(now / 2700 + 2) * 0.6 + morphNoiseD) * m * dt * 16, 0, 320);
  paramSeq++;
  if ((morphTick = (morphTick + 1) % 4) === 0) { // keep sliders/labels in sync, throttled
    $('R').value = String(Math.round(S.R));
    $('r').value = String(Math.round(S.r));
    $('d').value = String(Math.round(S.d));
    labels(); syncFills();
  }
}

/* ============================== main loop ============================== */
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - lastFrame) / 1000) || 0;
  lastFrame = now;

  if (S.playing) {
    if (S.fade) fadeFrame(dt);
    if (S.fade || S.fadeGlow) glowFade(dt); // aura keeps dissolving even once done
    if (!done) {
      if (S.morph) morphStep(now, dt);
      const T = tMax();
      const endless = S.fade || S.keep || S.morph; // wrap forever instead of stopping at closure
      let t0 = tCur, target = tCur + S.speed * dt, guard = 0;
      let closed = false;
      while (guard++ < 24) {
        if (endless) {
          if (target <= T) { strokeSeg(t0, target); tCur = target; break; }
          strokeSeg(t0, T);
          target -= T; t0 = 0;
          if (!S.morph && !S.fade) { // free-draw without param changes re-traces a closed curve — stop to avoid blow-out
            if (paramSeq === lastWrapSeq) { closed = true; tCur = 0; break; }
            lastWrapSeq = paramSeq;
          }
        } else {
          if (target >= T) { strokeSeg(t0, T); tCur = T; closed = true; }
          else { strokeSeg(t0, target); tCur = target; }
          break;
        }
      }
      if (closed) {
        done = true;
        showBadge(S.keep
          ? '✦ Curve closed — tweak any slider to keep drawing'
          : '✦ Curve complete — tweak a slider, hit Random or load a preset');
      }
    }
  }
  drawDot(now);
  if ((statTick = (statTick + 1) % 6) === 0) updateStat(); // progress line ~10x/s
}

function drawDot(now) {
  dctx.clearRect(0, 0, W, H);
  if (!S.playing || done) return;
  const [x, y] = pt(tCur, tAbs);
  const pulse = 5 + Math.sin(now / 160) * 2;
  dctx.globalCompositeOperation = 'lighter';
  const g = dctx.createRadialGradient(x, y, 0, x, y, pulse * 4);
  g.addColorStop(0, colorSpec(S.c2 ? S.hueSpeed * tAbs * 0.6 : hue, false).core);
  g.addColorStop(1, 'hsla(0,0%,0%,0)');
  dctx.fillStyle = g;
  dctx.beginPath();
  dctx.arc(x, y, pulse * 4, 0, TAU);
  dctx.fill();
}

/* ================================ UI ================================ */
const $ = (id) => document.getElementById(id);
const badge = $('badge');
const sliders = ['R','r','d','wob','wf','mirror','spin','sp','w','hs','g','ms','td','gd'];
const toggles = ['fade','fglow','keep','morph','twin','c2'];
const colors = ['ca','cb'];
const inputs = [...sliders, ...toggles, ...colors];

function syncFills() {
  for (const id of sliders) {
    const el = $(id);
    const p = ((el.value - el.min) / (el.max - el.min)) * 100;
    el.style.setProperty('--p', p + '%');
  }
}

// returns true if any geometry parameter changed
function readUI() {
  const prev = { R: S.R, r: S.r, d: S.d, wob: S.wob, wf: S.wf, mode: S.mode, mirror: S.mirror, spin: S.spin };
  S.R = +$('R').value; S.r = +$('r').value; S.d = +$('d').value;
  S.wob = +$('wob').value; S.wf = +$('wf').value;
  S.mirror = +$('mirror').value; S.spin = +$('spin').value;
  S.speed = +$('sp').value; S.width = +$('w').value;
  S.hueSpeed = +$('hs').value; S.glow = +$('g').value;
  S.morphSpeed = +$('ms').value;
  S.trailDur = +$('td').value; S.glowDur = +$('gd').value;
  S.fade = $('fade').checked; S.fadeGlow = $('fglow').checked;
  S.keep = $('keep').checked; S.morph = $('morph').checked;
  S.twin = $('twin').checked; S.c2 = $('c2').checked;
  S.colA = $('ca').value; S.colB = $('cb').value;
  return prev.R !== S.R || prev.r !== S.r || prev.d !== S.d || prev.wob !== S.wob ||
         prev.wf !== S.wf || prev.mode !== S.mode || prev.mirror !== S.mirror || prev.spin !== S.spin;
}

function writeUI() {
  $('R').value = S.R; $('r').value = S.r; $('d').value = S.d;
  $('wob').value = S.wob; $('wf').value = S.wf;
  $('mirror').value = S.mirror; $('spin').value = S.spin;
  $('sp').value = S.speed; $('w').value = S.width;
  $('hs').value = S.hueSpeed; $('g').value = S.glow; $('ms').value = S.morphSpeed;
  $('td').value = S.trailDur; $('gd').value = S.glowDur;
  $('fade').checked = S.fade; $('fglow').checked = S.fadeGlow;
  $('keep').checked = S.keep; $('morph').checked = S.morph;
  $('twin').checked = S.twin; $('c2').checked = S.c2;
  $('ca').value = S.colA; $('cb').value = S.colB;
  $('msField').classList.toggle('live', S.morph);
  $('tdField').classList.toggle('live', S.fade);
  $('gdField').classList.toggle('live', S.fade || S.fadeGlow);
  for (const b of $('mode').children) b.classList.toggle('on', b.dataset.mode === S.mode);
  syncFills();
}

// Slider inputs are rounded for their step=1 thumbs, but morph keeps fractional
// geometry internally — show the real value instead of the rounded input value.
const paramLabel = (v) => Number.isInteger(v) ? String(v) : v.toFixed(1);
function labels() {
  $('vR').textContent = paramLabel(S.R);
  $('vr').textContent = paramLabel(S.r);
  $('vd').textContent = paramLabel(S.d);
  $('vwob').textContent = Math.round(+$('wob').value);
  $('vwf').textContent = $('wf').value;
  $('vmir').textContent = $('mirror').value;
  $('vspn').textContent = (+$('spin').value).toFixed(1);
  $('vsp').textContent = (+$('sp').value).toFixed(1);
  $('vw').textContent = (+$('w').value).toFixed(1);
  $('vhs').textContent = (+$('hs').value).toFixed(1);
  $('vg').textContent = (+$('g').value).toFixed(1);
  $('vms').textContent = (+$('ms').value).toFixed(1);
  $('vtd').textContent = (+$('td').value).toFixed(1) + 's';
  $('vgd').textContent = (+$('gd').value).toFixed(1) + 's';
}

function pushHash() {
  const p = new URLSearchParams({
    m: S.mode, R: Math.round(S.R), r: Math.round(S.r), d: Math.round(S.d),
    wob: S.wob, wf: S.wf, mir: S.mirror, sn: S.spin, sp: S.speed, w: S.width,
    hs: S.hueSpeed, g: S.glow, ms: S.morphSpeed, td: S.trailDur, gd: S.glowDur, h: Math.round(hue0),
    ...(S.fade ? { f: 1 } : {}), ...(S.fadeGlow ? { fg: 1 } : {}),
    ...(S.keep ? { k: 1 } : {}), ...(S.morph ? { mo: 1 } : {}),
    ...(S.twin ? { tw: 1 } : {}), ...(S.c2 ? { c2: 1, ca: S.colA.slice(1), cb: S.colB.slice(1) } : {}),
    ...(locks.size ? { lk: [...locks].join(',') } : {}),
  });
  history.replaceState(null, '', '#' + p);
}
let hashTimer;
const scheduleHash = () => { clearTimeout(hashTimer); hashTimer = setTimeout(pushHash, 400); };

/* --------------------------- control locks --------------------------- */
// Locked controls are skipped by Random and by Auto-morph drift
const locks = new Set();
const isLocked = (id) => locks.has(id);

function syncLocks() {
  for (const b of document.querySelectorAll('.lock')) {
    const on = locks.has(b.dataset.lock);
    b.classList.toggle('on', on);
    b.textContent = on ? '🔒' : '🔓';
  }
}
function wireLocks() {
  for (const b of document.querySelectorAll('.lock')) {
    b.addEventListener('click', (e) => {
      e.preventDefault(); // don't let the surrounding label flip a checkbox
      e.stopPropagation();
      const id = b.dataset.lock;
      if (locks.has(id)) locks.delete(id); else locks.add(id);
      syncLocks();
      scheduleHash();
    });
  }
}

// geometry change while free-drawing: keep the canvas, connect from the pen's current spot
function onShapeChanged() {
  paramSeq++;
  if (S.fade) {
    // comet mode erases its own past — no wipe needed, keep drawing seamlessly
    unDone();
    return;
  }
  if (S.keep || S.morph) {
    pendingConnect = true;
    unDone();
  } else {
    restart();
  }
}

function checkImmediateDone() {
  if (!S.fade && !S.keep && !S.morph && tCur >= tMax() - 1e-9 && !done) {
    done = true;
    showBadge('✦ Curve complete — tweak a slider, hit Random or load a preset');
  }
}

// changes that only affect future strokes (no restart, no connector)
const STYLE_ONLY = new Set(['sp', 'w', 'hs', 'g', 'ms', 'td', 'gd', 'twin', 'c2', 'ca', 'cb']);

for (const id of inputs) {
  $(id).addEventListener('input', () => {
    const shapeChanged = readUI();
    labels(); syncFills(); scheduleHash();
    if (id === 'fade') {
      $('tdField').classList.toggle('live', S.fade);
      $('gdField').classList.toggle('live', S.fade || S.fadeGlow);
      restart(); return;
    }
    if (id === 'fglow') { $('gdField').classList.toggle('live', S.fade || S.fadeGlow); return; }
    if (STYLE_ONLY.has(id)) return;
    if (shapeChanged) onShapeChanged();
  });
}

$('morph').addEventListener('change', () => {
  readUI();
  $('msField').classList.toggle('live', S.morph);
  scheduleHash();
  if (S.morph) unDone(); else checkImmediateDone();
  lastWrapSeq = paramSeq;
});
$('keep').addEventListener('change', () => {
  readUI();
  scheduleHash();
  if (S.keep) { pendingConnect = !!lastPt; unDone(); }
  else checkImmediateDone();
  lastWrapSeq = paramSeq;
});

$('mode').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-mode]');
  if (!b || b.dataset.mode === S.mode) return;
  S.mode = b.dataset.mode;
  writeUI(); scheduleHash(); onShapeChanged();
});

$('play').addEventListener('click', togglePlay);
function togglePlay() {
  S.playing = !S.playing;
  $('play').textContent = S.playing ? '⏸ Pause' : '▶ Play';
}

$('clear').addEventListener('click', () => restart());
$('ff').addEventListener('click', fastForward);

$('rand').addEventListener('click', randomize);
function randomize() {
  const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const rf = (a, b, d) => +(a + Math.random() * (b - a)).toFixed(d);
  if (isLocked('mode')) { /* keep */ } else S.mode = Math.random() < 0.5 ? 'hypo' : 'epi';
  if (!isLocked('R')) S.R = ri(90, 380);
  if (!isLocked('r')) S.r = ri(6, 260);
  if (!isLocked('d')) S.d = ri(12, 300);
  if (!isLocked('wob')) S.wob = Math.random() < 0.5 ? 0 : ri(20, 120);
  if (!isLocked('wf')) S.wf = ri(2, 9);
  if (!isLocked('mirror')) S.mirror = Math.random() < 0.25 ? ri(2, 8) : 1;
  if (!isLocked('spin')) S.spin = Math.random() < 0.2 ? rf(-0.25, 0.25, 1) : 0;
  if (!isLocked('sp')) S.speed = rf(0.4, 5, 1);
  if (!isLocked('w')) S.width = rf(1, 2.4, 1);
  if (!isLocked('hs')) S.hueSpeed = rf(1, 5, 1);
  if (!isLocked('g')) S.glow = rf(2, 8, 1);
  if (!isLocked('ms')) S.morphSpeed = rf(0.4, 2.5, 1);
  if (!isLocked('td')) S.trailDur = rf(2, 24, 1);
  if (!isLocked('gd')) S.glowDur = rf(1, 8, 1);
  if (!isLocked('twin')) S.twin = Math.random() < 0.3;
  if (!isLocked('c2')) {
    S.c2 = Math.random() < 0.35;
    if (S.c2) { // harmonious random pair: hues 90–240° apart
      const hA = Math.random() * 360;
      S.colA = hslHex(hA);
      S.colB = hslHex((hA + 90 + Math.random() * 150) % 360);
    }
  }
  // engines: mostly stay off, but unlocked means Random may surprise you
  if (!isLocked('fade')) S.fade = Math.random() < 0.2;
  if (!isLocked('fglow')) S.fadeGlow = !S.fade && Math.random() < 0.35;
  if (!isLocked('keep')) S.keep = Math.random() < 0.15;
  if (!isLocked('morph')) S.morph = Math.random() < 0.1;
  hue0 = Math.random() * 360;
  writeUI(); labels(); scheduleHash(); restart();
}

// stack the layers (ink + glow + dot) into a fresh canvas, matching the on-screen blend
function composite() {
  const c = document.createElement('canvas');
  c.width = cv.width; c.height = cv.height;
  const x = c.getContext('2d');
  x.drawImage(cv, 0, 0);
  x.globalCompositeOperation = 'screen';
  x.drawImage(gcv, 0, 0);
  x.drawImage(dcv, 0, 0);
  return c;
}

$('save').addEventListener('click', () => {
  const a = document.createElement('a');
  a.download = `spirograph-${S.mode}-${Math.round(S.R)}x${Math.round(S.r)}x${Math.round(S.d)}.png`;
  a.href = composite().toDataURL('image/png');
  a.click();
});

$('link').addEventListener('click', async () => {
  pushHash(); // bake the current look into the URL first
  const url = location.href;
  let ok = false;
  try { await navigator.clipboard.writeText(url); ok = true; }
  catch {
    const ta = document.createElement('textarea');
    ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch {}
    ta.remove();
  }
  const b = $('link');
  b.textContent = ok ? '✅ Copied!' : '❌ Failed';
  setTimeout(() => { b.textContent = '🔗 Link'; }, 1400);
});

/* ------------------------------ recorder ------------------------------ */
let rec = null, recChunks = [], recTimer = 0, recT0 = 0;
let recCv = null, recCtx = null, recPumping = false;
function pumpRec() {
  if (!recPumping || !rec) return;
  if (recCv.width !== cv.width || recCv.height !== cv.height) {
    recCv.width = cv.width; recCv.height = cv.height;
  }
  recCtx.globalCompositeOperation = 'source-over';
  recCtx.clearRect(0, 0, recCv.width, recCv.height);
  recCtx.drawImage(cv, 0, 0);
  recCtx.globalCompositeOperation = 'screen';
  recCtx.drawImage(gcv, 0, 0);
  recCtx.drawImage(dcv, 0, 0);
  requestAnimationFrame(pumpRec);
}
const recBtn = $('rec');
recBtn.addEventListener('click', () => {
  if (rec) { rec.stop(); return; }
  if (typeof MediaRecorder === 'undefined' || typeof HTMLCanvasElement.prototype.captureStream !== 'function') {
    alert('Video recording is not supported in this browser — try Chrome, Edge or Firefox.');
    return;
  }
  recChunks = [];
  recCv = document.createElement('canvas');
  recCv.width = cv.width; recCv.height = cv.height;
  recCtx = recCv.getContext('2d');
  recPumping = true;
  requestAnimationFrame(pumpRec);
  const stream = recCv.captureStream(60);
  const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
    ? 'video/webm;codecs=vp9' : 'video/webm';
  rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12_000_000 });
  rec.ondataavailable = (e) => { if (e.data.size) recChunks.push(e.data); };
  rec.onstop = () => {
    recPumping = false;
    const url = URL.createObjectURL(new Blob(recChunks, { type: 'video/webm' }));
    const a = document.createElement('a');
    a.download = `spirograph-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.webm`;
    a.href = url; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    clearInterval(recTimer);
    rec = null; recCv = null; recCtx = null;
    recBtn.classList.remove('live');
    recBtn.textContent = '⏺ Rec';
  };
  rec.start(250);
  recT0 = performance.now();
  recBtn.classList.add('live');
  recTimer = setInterval(() => {
    const s = Math.floor((performance.now() - recT0) / 1000);
    recBtn.textContent = `⏹ ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }, 500);
});

// presets
const sel = $('presets');
for (const [i, p] of PRESETS.entries()) {
  const o = document.createElement('option');
  o.value = i; o.textContent = p.name;
  sel.appendChild(o);
}
sel.addEventListener('change', () => {
  const p = PRESETS[sel.value];
  if (!p) return;
  Object.assign(S, { mode: p.mode, R: p.R, r: p.r, d: p.d, wob: p.wob, wf: p.wf,
                     hueSpeed: p.hs, glow: p.g, width: p.w });
  S.mirror = p.mir ?? 1; S.spin = p.sn ?? 0; S.twin = !!p.tw;
  hue0 = p.hue;
  sel.value = '';
  writeUI(); labels(); scheduleHash(); restart();
});

// panel visibility (docked slide on desktop, overlay on mobile)
const panel = $('panel'), reveal = $('reveal');
function togglePanel(force) {
  const hide = force !== undefined ? force : !document.body.classList.contains('panel-hidden');
  document.body.classList.toggle('panel-hidden', hide);
  reveal.classList.toggle('show', hide);
}
$('collapse').addEventListener('click', () => togglePanel(true));
reveal.addEventListener('click', () => togglePanel(false));

// keyboard
addEventListener('keydown', (e) => {
  if (e.target.matches('input, select, textarea')) return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.code === 'KeyR') randomize();
  else if (e.code === 'KeyM') {
    const m = $('morph');
    m.checked = !m.checked;
    m.dispatchEvent(new Event('change'));
  }
  else if (e.code === 'KeyC') restart();
  else if (e.code === 'KeyL') $('link').click();
  else if (e.code === 'KeyH') togglePanel();
});

/* ============================== resize ============================== */
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = stage.clientWidth; H = stage.clientHeight; // stage = space right of the docked panel
  for (const c of [cv, gcv, dcv]) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  dctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  computeFit(); // center the cached background gradient correctly after layout changes
  paintBg();
  if (!S.fade) redrawTo(tCur); // keep artwork across resizes
  else lastPt = null;
}
let resizeTimer;
const scheduleResize = () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 120); };
addEventListener('resize', scheduleResize);            // window size or dpr (zoom) changed
new ResizeObserver(scheduleResize).observe(stage);     // panel slide/dock changed stage size

/* ============================== boot ============================== */
function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (![...p].length) return;
  // Every parameter is clamped to its slider range so malformed/stale links
  // cannot drive the geometry into NaN or out-of-range territory.
  const num = (k, def, lo, hi) => {
    const v = (p.has(k) && isFinite(+p.get(k))) ? +p.get(k) : def;
    return lo === undefined ? v : clamp(v, lo, hi);
  };
  if (p.get('m') === 'epi' || p.get('m') === 'hypo') S.mode = p.get('m');
  S.R = num('R', S.R, 40, 400); S.r = num('r', S.r, 4, 300); S.d = num('d', S.d, 0, 320);
  S.wob = num('wob', S.wob, 0, 160); S.wf = num('wf', S.wf, 1, 12);
  S.mirror = Math.round(num('mir', S.mirror, 1, 12)); S.spin = num('sn', S.spin, -1.5, 1.5);
  S.speed = num('sp', S.speed, 0.2, 8); S.width = num('w', S.width, 0.5, 6);
  S.hueSpeed = num('hs', S.hueSpeed, 0, 10); S.glow = num('g', S.glow, 0, 10);
  S.morphSpeed = num('ms', S.morphSpeed, 0.2, 4);
  S.trailDur = num('td', S.trailDur, 0.3, 60);
  S.glowDur = num('gd', S.glowDur, 0.3, 60);
  if (p.has('fd') && !p.has('td')) { // legacy link: per-frame fade % → equivalent seconds
    const f = clamp(num('fd', 5.5), 0.5, 20) / 100;
    S.trailDur = clamp(LN255 / (60 * -Math.log(1 - f)), 0.3, 60);
  }
  S.fade = p.has('f'); S.fadeGlow = p.has('fg'); S.keep = p.has('k'); S.morph = p.has('mo'); S.twin = p.has('tw');
  if (p.has('c2')) {
    S.c2 = true;
    const hex = (v) => (/^[0-9a-fA-F]{6}$/.test(v) ? '#' + v : null);
    S.colA = hex(p.get('ca')) || S.colA;
    S.colB = hex(p.get('cb')) || S.colB;
  }
  if (p.has('lk')) for (const id of p.get('lk').split(',')) if (id) locks.add(id.trim());
  hue0 = num('h', hue0, 0, 360);
}

loadHash();
wireLocks();
syncLocks();
writeUI();
labels();
resize();
restart();
updateStat();
requestAnimationFrame(frame);
if (innerWidth < 640) togglePanel(true);
</script>
</body>
</html>
